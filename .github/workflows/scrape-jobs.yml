name: Scrape Live Jobs and Internships

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Sc scraper Script
        run: python scripts/scrape_jobs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          git add cloud-loop-app/src/features/jobs/data/scraped-jobs.json
          git add cloud-loop-app/src/features/internships/data/scraped-internships.json
          git add cloud-loop-app/src/features/events/data/scraped-events.json
          git add cloud-loop-app/src/features/programs/data/scraped-programs.json
          git add cloud-loop-app/src/features/jobs/data/scraper-stats.json
          
          if git diff --staged --quiet; then
            echo "No new opportunities scraped today. Skipping commit."
          else
            git commit -m "Auto-scrape: Update jobs, internships, events, and student programs [skip ci]"
            git push origin main
          fi

