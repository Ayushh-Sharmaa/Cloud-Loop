version: '3.8'

services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: cloudloop-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=Db2Hack2026!
      - DBNAME=BLUDB
      - BLU=FALSE
      - ENABLE_ORACLE_COMPATIBILITY=FALSE
    volumes:
      - db2data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to BLUDB' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: cloudloop-ai-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AUTH_MODE=demo
      - DB2_HOST=db2
      - DB2_PORT=50000
      - DB2_DB=BLUDB
      - DB2_USERNAME=db2inst1
      - DB2_PASSWORD=Db2Hack2026!
      - DB2_SCHEMA=CLOUDLOOP
      - DB2_SSL=False
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384
      - ADMIN_API_KEY=cloudloop-admin-secret-key-2026
    depends_on:
      - db2
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: cloudloop-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FASTAPI_BACKEND_URL=http://ai-service:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - AUTH_MODE=demo
      - NEXT_PUBLIC_AUTH_MODE=demo
    depends_on:
      - ai-service
    restart: unless-stopped

volumes:
  db2data:
